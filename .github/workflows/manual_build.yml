name: 手动构建 YSTRM 镜像到 GHCR

# 手动触发，支持自定义镜像标签、构建平台
on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: '镜像标签（默认：latest）'
        required: false
        default: 'latest'
        type: string
      platform:
        description: '构建平台（默认：linux/amd64，多架构用英文逗号分隔：linux/amd64,linux/arm64）'
        required: false
        default: 'linux/amd64'
        type: string

# 环境变量统一配置
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cloudstream

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: network=host

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}
          flavor: |
            lowercase=true
            latest=${{ inputs.image-tag == 'latest' }}
          tags: |
            type=raw,value=${{ inputs.image-tag }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.description=YSTRM CloudStream
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.created_at }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          sbom: true
          quiet: false

      - name: 输出结果
        run: |
          echo "✅ 构建推送完成！"
          echo ""
          echo "镜像地址："
          echo "${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}"
          echo "${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo ""
          echo "所有标签："
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
