name: 手动构建 YSTRM 镜像到 GHCR

# 手动触发，支持自定义镜像标签、构建平台
on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: '镜像标签（默认：latest）'
        required: false
        default: 'latest'
        type: string
      platform:
        description: '构建平台（默认：linux/amd64，多架构用英文逗号分隔：linux/amd64,linux/arm64）'
        required: false
        default: 'linux/amd64'
        type: string

# 环境变量统一配置，便于维护
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cloudstream # 保留你原有的固定镜像名，如需动态则改为 ${{ github.repository }}

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    # GHCR推送/元数据所需最小权限
    permissions:
      contents: read
      packages: write
      id-token: write
    # 任务超时保护，避免无限构建
    timeout-minutes: 40
    steps:
      - name: 检查代码到构建机
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 仅拉取最新提交，提升检出速度

      - name: 配置Docker Buildx（支持多架构构建）
        uses: docker/setup-buildx-action@v3
        with:
          install: true # 强制安装最新版Buildx，兼容多架构
          driver-opts: network=host # 提升网络拉取基础镜像速度

      - name: 登录GHCR容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 自动生成，无需手动配置

      - name: 提取镜像元数据（标签/标准化标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 镜像完整地址：GHCR+用户名+镜像名
          images: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}
          # 强制镜像名转小写（GHCR仓库名要求小写，避免报错）
          flavor: |
            lowercase=true
            latest=${{ inputs.image-tag == 'latest' && 'true' || 'false' }} # 仅当标签为latest时自动补latest
          # 镜像标签：自定义标签 + 短SHA（带前缀，便于追溯）
          tags: |
            type=raw,value=${{ inputs.image-tag }}
            type=sha,format=short,prefix=sha-
          # 标准化OpenContainers标签，提升镜像兼容性
          labels: |
            org.opencontainers.image.authors=${{ github.actor }}<${{ github.actor }}@users.noreply.github.com>
            org.opencontainers.image.description=YSTRM CloudStream 手动构建镜像
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.created_at }}

      - name: 构建并推送Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: . # 构建上下文为项目根目录
          file: ./Dockerfile # 指定Dockerfile路径
          push: true # 推送到GHCR（测试时可改为false，仅构建不推送）
          platforms: ${{ inputs.platform }} # 自定义构建平台，支持多架构
          tags: ${{ steps.meta.outputs.tags }} # 引用元数据的标签
          labels: ${{ steps.meta.outputs.labels }} # 引用元数据的标准化标签
          # 构建缓存优化，提升二次构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 构建优化配置
          pull: true # 拉取基础镜像的最新版本
          sbom: true # 生成镜像SBOM清单，便于溯源
          quiet: false # 显示构建日志，方便问题排查

      - name: 校验镜像推送结果
        run: |
          echo -e "✅ 镜像构建推送完成！\n"
          echo "📌 自定义标签镜像地址：${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}"
          echo "📌 提交追溯镜像地址：${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha | substr(0,7) }}"
          echo -e "\n🔖 所有推送的标签："
          echo ${{ steps.meta.outputs.tags }} | tr ',' '\n'