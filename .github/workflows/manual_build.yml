name: 手动构建 YSTRM 镜像到 GHCR

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: '镜像标签（默认：latest）'
        required: false
        default: 'latest'
        type: string
      platform:
        description: '构建平台（默认：linux/amd64，多架构用英文逗号分隔：linux/amd64,linux/arm64）'
        required: false
        default: 'linux/amd64'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cloudstream

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 40
    steps:
      - name: 检查代码到构建机
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置Docker Buildx（支持多架构构建）
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: network=host

      - name: 登录GHCR容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据（标签/标准化标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ inputs.image-tag == 'latest' && 'true' || 'false' }}
          tags: |
            type=raw,value=${{ inputs.image-tag }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.authors=${{ github.actor }}
            org.opencontainers.image.description=YSTRM CloudStream 手动构建镜像
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.run_started_at }}

      - name: 构建并推送Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          sbom: true
          quiet: false

      - name: 校验镜像推送结果
        run: |
          echo -e "✅ 镜像构建推送完成！\n"
          echo "📌 自定义标签镜像地址：${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}"
          echo "📌 提交追溯镜像地址：${{ env.REGISTRY }}/${{ github.actor }}/${{ env.IMAGE_NAME }}:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo -e "\n🔖 所有推送的标签："
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
