name: 构建 CloudStream 镜像

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: '镜像标签'
        required: false
        default: 'latest'
        type: string
      platform:
        description: '构建平台，多个平台用逗号分隔'
        required: false
        default: 'linux/amd64'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.image-tag }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 SQLite 编译依赖
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: 运行后端测试
        run: CGO_ENABLED=1 go test ./...

  frontend-test:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 运行前端测试
        run: npm test

      - name: 构建前端
        run: npm run build

  docker:
    name: 构建并发布镜像
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 生成镜像名称
        shell: bash
        run: |
          IMAGE_ID="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "IMAGE_ID=${IMAGE_ID,,}" >> "$GITHUB_ENV"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_ID }}
          tags: |
            type=raw,value=${{ inputs.image-tag }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.description=CloudStream container image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 构建并按需推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: 输出已发布镜像
        run: printf '%s\n' '${{ steps.meta.outputs.tags }}'
