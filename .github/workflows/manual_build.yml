name: 手动构建 YSTRM 镜像到 GHCR

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: '镜像标签（默认：latest）'
        required: false
        default: 'latest'
        type: string
      platform:
        description: '构建平台（默认：linux/amd64，多架构用逗号分隔：linux/amd64,linux/arm64）'
        required: false
        default: 'linux/amd64'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: 60
    steps:
      - name: 检查代码到构建机
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 QEMU 模拟器
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: network=host

      - name: 格式化镜像名称
        run: |
          IMAGE_ID=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV

      - name: 登录 GHCR 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_ID }}
          flavor: |
            latest=${{ inputs.image-tag == 'latest' && 'true' || 'false' }}
          tags: |
            type=raw,value=${{ inputs.image-tag }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.description=${{ github.event.repository.name }} 自动构建镜像
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: false
          provenance: false

      - name: 校验镜像推送结果
        run: |
          echo -e "✅ 镜像构建推送完成！\n"
          echo "📌 你的镜像地址如下："
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'